# Configuration for Flood Exposure and Healthcare Facility Proximity Analysis
# Case Study: Cumilla District, August 2024 Bangladesh Floods

project:
  name: "cumilla-flood-geospatial-analysis"
  title: "Flood Exposure and Healthcare Facility Proximity Analysis: An Exploratory Case Study of the August 2024 Bangladesh Floods in Cumilla District"
  version: "1.0.0"
  study_area: "Cumilla"
  study_area_aliases: ["Cumilla", "Comilla"]
  country_iso: "BGD"
  event_glide: "FL20240825BGD"
  event_dates: "August - September 2024"

crs:
  geographic: "EPSG:4326"
  projected: "EPSG:32646"  # WGS 84 / UTM Zone 46N (Accurate for Eastern Bangladesh, units: meters)
  projected_alt: "EPSG:3106"  # Bangladesh Transverse Mercator (BTM)

data_sources:
  geoboundaries:
    name: "geoBoundaries Bangladesh ADM2"
    url: "https://github.com/wmgeolab/geoBoundaries/raw/9469f09/releaseData/gbOpen/BGD/ADM2/geoBoundaries-BGD-ADM2.geojson"
    license: "CC-BY 3.0 IGO / OCHA ROAP / BBS"
    vintage: "2020 / Dec 2023 release"
    local_file: "data/raw/geoboundaries_bgd_adm2.geojson"

  unosat_flood:
    product_id: 3954
    title: "Satellite detected water extents between 28 August & 4 September 2024 in Bangladesh"
    url: "https://unosat.org/static/unosat_filesystem/3954/FL20240825BGD_SHP.zip"
    metadata_url: "https://unosat.org/our_products/3954"
    sensor: "Copernicus Sentinel-1 SAR (10m resolution)"
    license: "Open Data / Creative Commons Attribution (UNOSAT / UNITAR)"
    local_zip: "data/raw/unosat_3954_flood.zip"
    extract_dir: "data/raw/unosat_3954"
    primary_period: "period_1"
    observation_periods:
      period_1:
        id: "period_1"
        name: "First Satellite Observation Period (18–26 August 2024)"
        date_range: "18 to 26 August 2024"
        shapefile_name: "S1_20240818_20240826_FloodExtent_Bangladesh.shp"
        relative_path: "FL20240825BGD_SHP/S1_20240818_20240826_FloodExtent_Bangladesh.shp"
        is_primary: true
        description: "Satellite-detected flood water extent from 18 to 26 August 2024"
      period_2:
        id: "period_2"
        name: "Second Satellite Observation Period (28 August–04 September 2024)"
        date_range: "28 August to 04 September 2024"
        shapefile_name: "S1_20240828_20240904_FloodExtent_Bangladesh.shp"
        relative_path: "FL20240825BGD_SHP/S1_20240828_20240904_FloodExtent_Bangladesh.shp"
        is_primary: false
        description: "Satellite-detected flood water extent from 28 August to 04 September 2024"

  unosat_assessment:
    product_id: 3937
    title: "Preliminary satellite-derived flood impact assessment, Cumilla City"
    url: "https://unosat.org/static/unosat_filesystem/3937/UNOSAT_Preliminary_Assessment_Report_FL20240825BGD_Comilla_30Aug2024.pdf"
    metadata_url: "https://unosat.org/our_products/3937"
    local_pdf: "data/raw/unosat_3937_assessment.pdf"

  osm_healthcare:
    name: "OpenStreetMap Healthcare Facilities (Hospitals, Clinics, Doctors)"
    source: "OpenStreetMap contributors via Overpass API / HOT OSM"
    license: "ODbL (Open Database License)"
    amenity_tags: ["hospital", "clinic", "doctors"]
    endpoints:
      - "https://overpass.osm.ch/api/interpreter"
      - "https://overpass.kumi.systems/api/interpreter"
      - "https://overpass-api.de/api/interpreter"
    hot_osm_url: "https://production-raw-data-api.s3.amazonaws.com/ISO3/BGD/health_facilities/hotosm_bgd_health_facilities_osm_geojson.zip"
    local_geojson: "data/raw/osm_healthcare_raw.geojson"

paths:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  outputs_dir: "outputs"
  figures_dir: "outputs/figures"
  reports_dir: "reports"
  manifest_path: "data/source_data_manifest.json"

analysis:
  distance_bands_m: [0, 500, 1000, 2500, 5000]
  buffer_distances_m: [500, 1000, 2500]
